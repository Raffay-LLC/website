<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Raffay Sajjad</title>
    <!--meta-->

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0d" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

    <script>
      // Motion is progressive enhancement. `js` unlocks the hidden "before"
      // states in CSS; without it (no JavaScript, or the bundle never mounts)
      // everything stays visible. A mounted app sets data-mounted at once.
      document.documentElement.classList.add('js')
      setTimeout(function () {
        if (!document.documentElement.hasAttribute('data-mounted')) document.documentElement.classList.remove('js')
      }, 6000)
    </script>

    <!--jsonld-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
